name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      # Compile-checks the e2e and live tagged files without running them.
      - name: go vet (e2e, live tags)
        run: go vet -tags e2e,live ./...
      - name: go test
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  # The headless browser walkthrough (HLD 9). Needs Chromium, so it is its own job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # No @version: go run takes playwright-go's version from go.mod, so the
      # driver always matches the library.
      - name: Install Playwright driver and Chromium
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      - name: go test (e2e)
        run: go test -tags e2e -count=1 ./internal/demo/...
