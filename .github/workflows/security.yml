name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  security:
    name: security
    permissions:
      contents: read
      security-events: write # a caller covers every called job, even with codeql: false
    uses: redscaresu/github-actions/.github/workflows/security.yml@c2c992c0fe67b561b37874af8a429972ad856d69
    with:
      codeql: false
