name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  security:
    name: security
    permissions:
      contents: read
      security-events: write # codeql uploads its results
    uses: redscaresu/github-actions/.github/workflows/security.yml@c2c992c0fe67b561b37874af8a429972ad856d69 # v1.0.0
